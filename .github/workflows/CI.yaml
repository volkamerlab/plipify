name: CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  # schedule:
  #   # Nightly Tests
  #   - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] # , macOS-latest, windows-latest]
        python-version: ["3.11"]
    env:
      PYVER: ${{ matrix.python-version }}
      CI_OS: ${{ matrix.os }}
      PACKAGE: "plipify"

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - name: Set up Miniconda and create the test environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          environment-file: devtools/conda-envs/test_env.yaml
          activate-environment: test

      - name: Fix conda in MacOS
        shell: bash
        if: startsWith(matrix.os, 'macOS')
        run: |
          sudo chown -R $(id -u):$(id -g) ${CONDA}

      - name: Install package
        shell: bash -el {0}
        run: |
          python -m pip install . --no-deps
          conda list --show-channel-urls

      - name: Run tests (pytest)
        shell: bash -el {0}
        run: |
          pytest -v --cov=$PACKAGE --cov-report=xml --color=yes --doctest-modules $PACKAGE/

      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests

  lint-format:
    runs-on: ubuntu-latest
    env:
      CI_OS: ubuntu-latest
      PACKAGE: "plipify"

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup packages
        shell: bash
        run: |
          python -m pip install flake8 black

      - name: Run flake8
        shell: bash
        run: |
          flake8 $PACKAGE/

      - name: Run black check
        shell: bash
        if: always()
        run: |
          black --check -l 99 $PACKAGE/ --exclude=$PACKAGE/_version.py
